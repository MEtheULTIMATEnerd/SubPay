# Tool configuration only. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends(...) in argument defaults is the intended pattern.
ignore = ["B008"]
